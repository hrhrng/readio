name: tui-release

# Tag `tui-vX.Y.Z` and the binaries appear. Miniaudio is the only bundled C;
# it uses pregenerated bindings, so Apple has a compiler already and Linux only
# needs musl's compiler/linker. No system audio development package is linked.
on:
  push:
    tags: ["tui-v*"]
  pull_request:
    paths:
      - "apps/tui/**"
      - ".github/workflows/tui-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. tui-v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  READIO_RELEASE_VERSION: ${{ github.event_name == 'pull_request' && 'tui-v0.0.0-ci' || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

defaults:
  run:
    working-directory: apps/tui

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was retired and macos-14 is deprecated: macos-15 is the
          # arm64 image, macos-15-intel the x86_64 one.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      # musl-tools compiles bundled miniaudio and links the static binary.
      - name: Install musl tooling
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/readio"
          "$binary" --version
          "$binary" --help

      - name: Run Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/readio.exe" --version
          & "target/${{ matrix.target }}/release/readio.exe" --help

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$READIO_RELEASE_VERSION"
          name="readio-${version}-${{ matrix.target }}.tar.gz"
          # The archive holds the binary at its root, README and LICENSE
          # alongside: install.sh expects ./readio after unpacking.
          tar -czf "$name" \
            -C "target/${{ matrix.target }}/release" readio \
            -C "$GITHUB_WORKSPACE/apps/tui" README.md LICENSE

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:READIO_RELEASE_VERSION
          $name = "readio-$version-${{ matrix.target }}.zip"
          $stage = Join-Path $env:RUNNER_TEMP "readio-package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/readio.exe", "README.md", "LICENSE" -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $name

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: apps/tui/readio-*-${{ matrix.target }}.*
          if-no-files-found: error

  verify:
    name: verify release archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify all target archives and their root contents
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-unknown-linux-musl
            x86_64-unknown-linux-musl
          )
          for target in "${targets[@]}"; do
            archive="readio-${READIO_RELEASE_VERSION}-${target}.tar.gz"
            test -f "$archive"
            diff -u \
              <(printf '%s\n' LICENSE README.md readio) \
              <(tar -tzf "$archive" | sed 's#^\./##' | sort)
          done

          windows="readio-${READIO_RELEASE_VERSION}-x86_64-pc-windows-msvc.zip"
          test -f "$windows"
          diff -u \
            <(printf '%s\n' LICENSE README.md readio.exe) \
            <(unzip -Z1 "$windows" | tr -d '\r' | sed 's#^\./##' | sort)

          count="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')"
          test "$count" -eq 5

  publish:
    name: publish
    if: github.event_name != 'pull_request'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file for the whole release: install.sh verifies the archive
      # against it before unpacking anything.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.READIO_RELEASE_VERSION }}
          name: readio tui ${{ env.READIO_RELEASE_VERSION }}
          draft: false
          # A tag with a hyphen in its version is a prerelease by semver's own
          # rules — `tui-v0.2.0-beta.1` gets the badge, `tui-v0.2.0` does not.
          prerelease: ${{ contains(env.READIO_RELEASE_VERSION, '-beta') || contains(env.READIO_RELEASE_VERSION, '-rc') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            apps/tui/scripts/install.ps1

  smoke-windows:
    name: install published Windows release
    needs: publish
    runs-on: windows-latest
    steps:
      - name: Download the published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:READIO_RELEASE_VERSION
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern install.ps1 --dir $env:RUNNER_TEMP
          "READIO_TEST_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install twice and run the published binary
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "readio-bin"
          $sentinel = Join-Path $HOME ".readio/ci-sentinel"
          New-Item -ItemType Directory -Force -Path (Split-Path $sentinel) | Out-Null
          Set-Content -LiteralPath $sentinel -Value "keep"
          & "$env:RUNNER_TEMP/install.ps1" -Version $env:READIO_TEST_TAG -InstallDir $installDir
          & "$installDir/readio.exe" --version
          & "$installDir/readio.exe" --help
          & "$env:RUNNER_TEMP/install.ps1" -Version $env:READIO_TEST_TAG -InstallDir $installDir
          if ((Get-Content -LiteralPath $sentinel) -ne "keep") { throw "installer changed user data" }
