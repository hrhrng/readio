[package]
name = "readio-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for the Readio core engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
readio-bridge = { path = "../readio-bridge" }
readio-sdk = { path = "../readio-sdk", features = ["native-media"] }
serde_json.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
zip.workspace = true
