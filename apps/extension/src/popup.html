<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readio Companion</title>
    <style>
      :root {
        --bg: #f6f8fd;
        --panel: #ffffff;
        --ink: #0d1730;
        --muted: #55627f;
        --accent: #0f67ff;
        --border: #d6def0;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 360px;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(140deg, var(--bg), #e9efff);
        color: var(--ink);
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
        padding: 12px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      p,
      label {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .row {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        color: var(--ink);
        background: #fff;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      button {
        border: 1px solid transparent;
        border-radius: 10px;
        min-height: 40px;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .secondary {
        border-color: var(--border);
        background: #f7f9ff;
      }

      #status {
        margin-top: 8px;
        font-size: 12px;
      }

      #status[data-variant='error'] {
        color: var(--danger);
      }

      #player {
        margin-top: 8px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Readio</h1>
      <p>Capture current page text and synthesize with your configured TTS providers.</p>

      <div class="row">
        <label for="apiBase">API Base</label>
        <input id="apiBase" type="url" value="http://127.0.0.1:8000" />
      </div>

      <div class="row">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="auto">Auto fallback</option>
          <option value="edge">Edge TTS</option>
          <option value="elevenlabs">ElevenLabs</option>
          <option value="minimax">MiniMax</option>
        </select>
      </div>

      <div class="row">
        <label for="speed">Speed <span id="speedValue">1.00x</span></label>
        <input id="speed" type="range" min="0.7" max="2.5" step="0.05" value="1" />
      </div>

      <div class="row actions">
        <button id="captureSelection" class="secondary" type="button">Capture</button>
        <button id="synthesize" class="primary" type="button">Speak</button>
      </div>

      <div class="row">
        <label for="sourceText">Captured Text</label>
        <textarea id="sourceText" placeholder="Capture text from active tab"></textarea>
      </div>

      <div class="row actions">
        <button id="saveLibrary" class="secondary" type="button">Save</button>
        <button id="stopAudio" class="secondary" type="button">Stop</button>
      </div>

      <p id="status" data-variant="info">Ready</p>
      <audio id="player" controls preload="none"></audio>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
